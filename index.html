<!DOCTYPE html>
<html lang="en" data-phase="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethan Rasmussen</title>
<meta name="description" content="Personal portfolio of Ethan Rasmussen — experience, projects, and research.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Living pixel-art scene: sky + clouds everywhere, lake at the bottom -->
<canvas id="scene" aria-label="Animated pixel art lake scene. Click the lake to play a fishing mini-game."></canvas>

<!-- Fishing mini-game UI (built by js/game.js) -->
<div id="game-ui"></div>

<!-- Top navigation -->
<header id="nav">
  <a class="brand" href="#/" id="brand">Ethan Rasmussen</a>
  <nav class="tabs" aria-label="Pages">
    <a href="#/" data-route="/">My Experience</a>
    <a href="#/projects" data-route="/projects">Personal Projects</a>
    <a href="#/research" data-route="/research">Research &amp; Publications</a>
  </nav>
  <div class="socials">
    <a id="link-linkedin" href="#" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">
      <svg viewBox="0 0 12 12" width="22" height="22" shape-rendering="crispEdges" aria-hidden="true">
        <rect x="0" y="0" width="12" height="12" fill="currentColor" opacity="0.15"/>
        <rect x="1" y="1" width="10" height="10" fill="none"/>
        <rect x="2" y="2" width="2" height="2" fill="currentColor"/>
        <rect x="2" y="5" width="2" height="5" fill="currentColor"/>
        <rect x="5" y="5" width="2" height="5" fill="currentColor"/>
        <rect x="7" y="6" width="1" height="1" fill="currentColor"/>
        <rect x="8" y="5" width="2" height="5" fill="currentColor"/>
      </svg>
    </a>
    <a id="link-github" href="#" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
      <!-- pixel-art GitHub mark: ears, head, neck, tail & arm (see inspiration/github.jpg) -->
      <svg viewBox="0 0 16 16" width="23" height="23" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">
        <rect x="5"  y="1"  width="1"  height="2"/>
        <rect x="10" y="1"  width="1"  height="2"/>
        <rect x="4"  y="3"  width="8"  height="1"/>
        <rect x="3"  y="4"  width="10" height="4"/>
        <rect x="5"  y="8"  width="6"  height="2"/>
        <rect x="3"  y="10" width="1"  height="1"/>
        <rect x="6"  y="10" width="4"  height="4"/>
      </svg>
    </a>
  </div>
</header>

<!-- Scrollable content area (the "sky" region) -->
<main id="scroller">
  <div id="page" class="page"></div>
  <footer id="footer"></footer>
</main>

<!-- Custom wood & paper scrollbar (driven by js/scrollbar.js) -->
<div id="scrollbar" aria-hidden="true">
  <div class="sb-track">
    <div class="sb-thumb"></div>
  </div>
  <div class="sb-hint">▼</div>
</div>

<!-- Editable content -->
<script src="content/site.js"></script>
<script src="content/about.js"></script>
<script src="content/projects.js"></script>
<script src="content/research.js"></script>

<!-- Site code -->
<script src="js/app.js"></script>
<script src="js/scrollbar.js"></script>
<script src="js/game.js"></script>
<script src="js/scene.js"></script>
</body>
</html>
